<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>nopywer frontend companion</title>
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            crossorigin=""
        />
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <main class="layout">
            <section class="panel">
                <p class="eyebrow">nopywer companion</p>
                <h1>Frontend for development only</h1>
                <p class="description">
                    Minimal embedded map for <code>nopywer</code>.
                </p>
                <div class="actions">
                    <input type="file" id="upload-input" accept=".geojson,application/json" style="display:none" />
                    <button id="upload-button" style="background-color: rgb(169, 82, 25); color: white;">Upload nodes</button>
                    <button id="optimize-button" type="button">Optimize power layout</button>
                    <div style="margin: 8px 0;">
                    <label for="hub-discount">Hub discount: <span id="hub-discount-val">0.7</span></label>
                    <input type="range" id="hub-discount" min="0" max="1" step="0.05" value="0.7" 
                        oninput="document.getElementById('hub-discount-val').textContent = this.value">
                    </div>
                    <div style="margin: 8px 0;">
                    <label for="radiality-factor">Radiality: <span id="radiality-factor-val">0.3</span></label>
                    <input type="range" id="radiality-factor" min="0" max="2" step="0.1" value="0.3"
                        oninput="document.getElementById('radiality-factor-val').textContent = this.value">

                </div>
                    <button id="reset-button" type="button" class="secondary">Reset view</button>
                </div>
                <dl class="stats">
                    <div>
                        <dt>Power nodes</dt>
                        <dd id="node-count">-</dd>
                    </div>
                    <div>
                        <dt>Optimizer</dt>
                        <dd id="optimizer-status">idle</dd>
                    </div>
                </dl>
                <p id="message" class="message">
                    Waiting for the bundled power nodes dataset.
                </p>
            </section>
            <div id="map" aria-label="Power nodes map"></div>
        </main>

        <script
            src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            crossorigin=""
        ></script>
        <script src="./app.js"></script>
    </body>
</html>
