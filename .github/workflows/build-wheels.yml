name: Build and Release Wheels

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Mandatory for action-gh-release to create/update releases
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history so tools like hatch-vcs can derive version

      - name: Set up uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098  # Match ci.yml version
        with:
          enable-cache: true

      - name: Build distributions
        run: uv build

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*  # Uploads both .whl (wheel) and .tar.gz (sdist)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
